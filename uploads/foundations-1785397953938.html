<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Dorota Jarošová</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #FFFEEE;
      --blue:   #063DCC;
      --nav-h:  64px;
      --gutter: clamp(24px, 5.5vw, 88px);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--blue);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ─── Navigation ─────────────────────────────────────────── */
    nav {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--gutter);
      background: var(--cream);
      z-index: 100;
    }

    .nav-name {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: clamp(12px, 1.1vw, 14px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--blue);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: clamp(20px, 3vw, 48px);
    }

    .nav-links a {
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: clamp(14px, 1.1vw, 16px);
      color: var(--blue);
      text-decoration: none;
      position: relative;
      padding-bottom: 3px;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1.5px;
      background: var(--blue);
      transition: width 0.4s linear;
    }
    .nav-links a:hover::after  { width: 100%; }
    .nav-links a.active::after { width: 100%; transition: none; }
    .nav-links a.active        { font-weight: 700; }

    /* ─── Page layout ────────────────────────────────────────── */
    .page {
      height: 100svh;
      display: flex;
      flex-direction: column;
      padding-top: var(--nav-h);
    }

    /* ─── Contact card ───────────────────────────────────────── */
    .contact {
      background: var(--blue);
      color: var(--cream);
      margin: clamp(20px, 2.5vw, 40px) clamp(16px, 7vw, 192px) 0;
      padding: clamp(48px, 7vw, 96px) clamp(32px, 5.5vw, 80px) clamp(64px, 9vw, 120px);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .contact-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-header {
      font-family: 'Fraunces', serif;
      font-weight: 300;
      font-size: clamp(34px, 5.5vw, 80px);
      line-height: 1.06;
      margin-bottom: clamp(36px, 5vw, 64px);
    }

    .contact-email {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: clamp(18px, 2.2vw, 34px);
      color: var(--cream);
      text-decoration: none;
      display: inline-block;
      position: relative;
      padding-bottom: 4px;
    }

    .contact-email::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--cream);
      transition: width 0.4s linear;
    }

    .contact-email:hover::after { width: 100%; }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 700px) {
      .contact { margin: 0 8px; }
    }

    @media (max-width: 420px) {
      nav { padding: 0 20px; }
      .contact { padding: 36px 20px 56px; }
      .nav-links { gap: 16px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-name">Dorota Jarošová</a>
    <div class="nav-links">
      <a href="index.html#work">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <div class="page">
    <section class="contact">
      <h2 class="contact-header">Get in touch!</h2>
      <div class="contact-center">
        <a href="mailto:dori.jaros@gmail.com" class="contact-email">dori.jaros@gmail.com</a>
      </div>
    </section>
  </div>

</body>
</html>
